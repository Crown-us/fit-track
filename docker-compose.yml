services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Read from .env or the shell; compose refuses to start without it.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 random bytes}
      JWT_TTL: ${JWT_TTL:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
    volumes:
      - fittrack-data:/data
    restart: unless-stopped

volumes:
  fittrack-data:
